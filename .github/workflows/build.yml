name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Получаем исходники проекта
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Устанавливаем системные зависимости
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            gettext \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk


      # ==========================================
      # 3. Проверяем autotools / libtool
      # ==========================================
      - name: Prepare autotools
        run: |
          autoconf --version
          automake --version
          libtool --version

          libtoolize --force --copy || true
          aclocal || true
          autoreconf -fi || true


      # ==========================================
      # 4. Устанавливаем Python 3.11
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 5. Обновляем pip
      # ==========================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel


      # ==========================================
      # 6. Устанавливаем Buildozer
      # ==========================================
      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install "cython==0.29.36"


      # ==========================================
      # 7. Показываем версии
      # ==========================================
      - name: Show versions
        run: |
          python --version
          pip --version
          buildozer --version
          java -version
          autoconf --version
          libtool --version


      # ==========================================
      # 8. Чистим старую сборку
      # ==========================================
      - name: Clean Buildozer
        run: |
          buildozer android clean || true
          rm -rf .buildozer
          rm -rf bin


      # ==========================================
      # 9. Сборка APK
      # ==========================================
      - name: Build APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          buildozer -v android debug


      # ==========================================
      # 10. Показываем полученные APK
      # ==========================================
      - name: List APK files
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print


      # ==========================================
      # 11. Загружаем APK в Artifacts
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEOR-Recoil-Lab-APK
          path: |
            bin/*.apk
          if-no-files-found: error
